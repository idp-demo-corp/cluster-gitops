apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: k8s-platform-secrets
spec:
  provider:
    kubernetes:
      remoteNamespace: platform-secrets
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: default
      auth:
        token:
          bearerToken:
            name: eso-k8s-store-token
            key: token
            namespace: extrernal-secrets-operator
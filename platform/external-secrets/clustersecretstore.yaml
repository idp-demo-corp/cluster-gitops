apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: k8s-platform-secrets
spec:
  provider:
    kubernetes:
      remoteNamespace: platform-secrets
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: external-secrets-operator
      auth:
        serviceAccount:
          name: eso-k8s-store
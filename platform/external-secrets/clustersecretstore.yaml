apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-k8s-store
  namespace: external-secrets-operator
---
apiVersion: v1
kind: Secret
metadata:
  name: eso-k8s-store-token
  namespace: external-secrets-operator
  annotations:
    kubernetes.io/service-account.name: eso-k8s-store
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-k8s-store-secrets
  namespace: external-secrets-operator
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-k8s-store-secrets
  namespace: external-secrets-operator
subjects:
  - kind: ServiceAccount
    name: eso-k8s-store
    namespace: external-secrets-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-k8s-store-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eso-k8s-store-review
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources:
      - selfsubjectrulesreviews
      - selfsubjectaccessreviews
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eso-k8s-store-review
subjects:
  - kind: ServiceAccount
    name: eso-k8s-store
    namespace: external-secrets-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eso-k8s-store-review
---
apiVersion: v1
kind: Secret
metadata:
  name: seed-secret
  namespace: external-secrets-operator
type: Opaque
stringData:
  foo: bar
---
apiVersion: operator.openshift.io/v1alpha1
kind: ExternalSecretsConfig
metadata:
  name: cluster
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: k8s-platform-secrets
spec:
  provider:
    kubernetes:
      remoteNamespace: external-secrets-operator
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: external-secrets-operator
      auth:
        token:
          bearerToken:
            name: eso-k8s-store-token
            key: token
            namespace: external-secrets-operator
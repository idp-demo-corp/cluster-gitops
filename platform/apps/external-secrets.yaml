apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/idp-demo-corp/cluster-gitops.git
    path: platform/external-secrets
    targetRevision: 29gc9
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets-operator
  syncPolicy:
    automated: 
      prune: true
      selfHeal: true
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rhdh-secrets
  namespace: developer-hub
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: k8s-platform-secrets
    kind: ClusterSecretStore
  target:
    name: platform-seed-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        BACKEND_SECRET: "{{ .backstageBackendSecret }}"
        GIT_TOKEN: "{{ .backstageGitToken }}"
        K8S_CLUSTER_URL: "https://api.{{ .clusterDomain }}:6443"
  data:
    - secretKey: backstageBackendSecret
      remoteRef:
        key: platform-seed-secret
        property: backstageBackendSecret
    - secretKey: backstageGitToken
      remoteRef:
        key: platform-seed-secret
        property: backstageGitToken
    - secretKey: clusterDomain
      remoteRef:
        key: platform-seed-secret
        property: clusterDomain